[build-system]
requires = ["setuptools>=71,<80"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_seed_noid"
version = "0.1.0"
description = "LeRobot external Robot plugin for SEED/NOID ROS 2 robots."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SEED/NOID LeRobot Plugin Maintainers" }]
keywords = ["lerobot", "ros2", "ros2_control", "seed", "noid", "robotics"]

dependencies = [
  "lerobot==0.6.0",
  "numpy>=2.0,<2.3",
]

[project.urls]
Documentation = "https://huggingface.co/docs/lerobot/integrate_hardware"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lerobot_robot_seed_noid*"]
